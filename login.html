<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ChatWith.ai — Sign In</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      font-family: 'Inter', sans-serif;
      background: #060912;
      color: #e2e8f0;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }

    /* Background blobs */
    .bg-blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.12;
      pointer-events: none;
      z-index: 0;
    }
    .blob1 { width: 500px; height: 500px; background: #3b82f6; top: -100px; left: -100px; }
    .blob2 { width: 400px; height: 400px; background: #06b6d4; bottom: -80px; right: -80px; }
    .blob3 { width: 300px; height: 300px; background: #8b5cf6; top: 40%; left: 40%; }

    /* Card */
    .card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 420px;
      background: rgba(13, 20, 38, 0.9);
      border: 1px solid rgba(99,179,237,0.15);
      border-radius: 20px;
      padding: 40px 36px;
      backdrop-filter: blur(20px);
    }

    /* Logo */
    .logo-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 28px;
    }
    .logo-icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: linear-gradient(135deg, #3b82f6, #06b6d4);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      box-shadow: 0 8px 24px rgba(59,130,246,0.3);
    }
    .logo-text {
      font-size: 22px;
      font-weight: 600;
      letter-spacing: -0.3px;
    }
    .logo-text span { color: #60a5fa; }

    /* Heading */
    .heading {
      text-align: center;
      margin-bottom: 32px;
    }
    .heading h1 {
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 8px;
      letter-spacing: -0.3px;
    }
    .heading p {
      font-size: 14px;
      color: #64748b;
      line-height: 1.5;
    }

    /* Tabs */
    .tabs {
      display: flex;
      background: #0a0f1e;
      border: 1px solid rgba(99,179,237,0.1);
      border-radius: 10px;
      padding: 4px;
      margin-bottom: 24px;
    }
    .tab {
      flex: 1;
      padding: 8px;
      text-align: center;
      font-size: 13px;
      font-weight: 500;
      color: #64748b;
      cursor: pointer;
      border-radius: 7px;
      transition: all 0.2s;
      border: none;
      background: none;
      font-family: 'Inter', sans-serif;
    }
    .tab.active {
      background: linear-gradient(135deg, #3b82f6, #06b6d4);
      color: #fff;
    }

    /* Forms */
    .form-section { display: none; }
    .form-section.active { display: block; }

    .field {
      margin-bottom: 16px;
    }
    .field label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: #94a3b8;
      margin-bottom: 7px;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }
    .field input {
      width: 100%;
      padding: 11px 14px;
      background: #0a0f1e;
      border: 1px solid rgba(99,179,237,0.15);
      border-radius: 9px;
      color: #e2e8f0;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .field input:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59,130,246,0.1);
    }
    .field input::placeholder { color: #334155; }

    /* Buttons */
    .btn-primary {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #3b82f6, #06b6d4);
      border: none;
      border-radius: 10px;
      color: #fff;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
      margin-top: 4px;
    }
    .btn-primary:hover { opacity: 0.88; }
    .btn-primary:active { transform: scale(0.98); }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

    /* Divider */
    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 20px 0;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: rgba(99,179,237,0.12);
    }
    .divider span { font-size: 12px; color: #334155; white-space: nowrap; }

    /* Google button */
    .btn-google {
      width: 100%;
      padding: 11px 14px;
      background: #0a0f1e;
      border: 1px solid rgba(99,179,237,0.18);
      border-radius: 10px;
      color: #e2e8f0;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: background 0.2s, border-color 0.2s;
    }
    .btn-google:hover {
      background: #111827;
      border-color: rgba(99,179,237,0.3);
    }
    .google-icon {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }

    /* Error / success */
    .msg-box {
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 16px;
      display: none;
    }
    .msg-box.error {
      background: rgba(239,68,68,0.1);
      border: 1px solid rgba(239,68,68,0.2);
      color: #f87171;
    }
    .msg-box.success {
      background: rgba(34,197,94,0.1);
      border: 1px solid rgba(34,197,94,0.2);
      color: #4ade80;
    }
    .msg-box.show { display: block; }

    /* Footer note */
    .footer-note {
      text-align: center;
      font-size: 12px;
      color: #334155;
      margin-top: 20px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="bg-blob blob1"></div>
  <div class="bg-blob blob2"></div>
  <div class="bg-blob blob3"></div>

  <div class="card">
    <div class="logo-wrap">
      <div class="logo-icon">🤖</div>
      <span class="logo-text">ChatWith<span>.ai</span></span>
    </div>

    <div class="heading">
      <h1>Welcome back</h1>
      <p>Sign in to continue your conversations</p>
    </div>

    <!-- Tabs -->
    <div class="tabs">
      <button class="tab active" onclick="switchTab('login')">Sign In</button>
      <button class="tab" onclick="switchTab('signup')">Sign Up</button>
    </div>

    <!-- Error/Success -->
    <div class="msg-box" id="msgBox"></div>

    <!-- Login Form -->
    <div class="form-section active" id="loginForm">
      <div class="field">
        <label>Email</label>
        <input type="email" id="loginEmail" placeholder="you@example.com"/>
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="loginPassword" placeholder="Enter your password"/>
      </div>
      <button class="btn-primary" id="loginBtn" onclick="emailLogin()">Sign In</button>

      <div class="divider"><span>or continue with</span></div>
      <button class="btn-google" onclick="googleLogin()">
        <svg class="google-icon" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
        </svg>
        Continue with Google
      </button>
    </div>

    <!-- Signup Form -->
    <div class="form-section" id="signupForm">
      <div class="field">
        <label>Full Name</label>
        <input type="text" id="signupName" placeholder="Your name"/>
      </div>
      <div class="field">
        <label>Email</label>
        <input type="email" id="signupEmail" placeholder="you@example.com"/>
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="signupPassword" placeholder="Min 6 characters"/>
      </div>
      <button class="btn-primary" id="signupBtn" onclick="emailSignup()">Create Account</button>

      <div class="divider"><span>or continue with</span></div>
      <button class="btn-google" onclick="googleLogin()">
        <svg class="google-icon" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
        </svg>
        Continue with Google
      </button>
    </div>

    <p class="footer-note">By signing in, you agree to our Terms of Service.<br/>Your conversations are private and secure.</p>
  </div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyAuhxzDIh1R1QU41aAM4yo7kHnyM1FVcHE",
  authDomain: "chatwith-ai-cbdcc.firebaseapp.com",
  projectId: "chatwith-ai-cbdcc",
  storageBucket: "chatwith-ai-cbdcc.firebasestorage.app",
  messagingSenderId: "405030023529",
  appId: "1:405030023529:web:b5d61cde0a6dfb31b68df8"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();

auth.onAuthStateChanged(u => {
  if (u) window.location.href = "index.html";
});

function switchTab(tab) {
  document.querySelectorAll('.tab').forEach((t,i) => t.classList.toggle('active', (tab==='login'&&i===0)||(tab==='signup'&&i===1)));
  document.getElementById('loginForm').classList.toggle('active', tab==='login');
  document.getElementById('signupForm').classList.toggle('active', tab==='signup');
  hideMsg();
}

function showMsg(text, type='error') {
  const el = document.getElementById('msgBox');
  el.textContent = text;
  el.className = 'msg-box show ' + type;
}
function hideMsg() {
  document.getElementById('msgBox').className = 'msg-box';
}

async function emailLogin() {
  const email = document.getElementById('loginEmail').value.trim();
  const pass = document.getElementById('loginPassword').value;
  if (!email || !pass) { showMsg('Please fill in all fields.'); return; }
  const btn = document.getElementById('loginBtn');
  btn.disabled = true; btn.textContent = 'Signing in...';
  try {
    await auth.signInWithEmailAndPassword(email, pass);
  } catch(e) {
    showMsg(friendlyError(e.code));
    btn.disabled = false; btn.textContent = 'Sign In';
  }
}

async function emailSignup() {
  const name = document.getElementById('signupName').value.trim();
  const email = document.getElementById('signupEmail').value.trim();
  const pass = document.getElementById('signupPassword').value;
  if (!name || !email || !pass) { showMsg('Please fill in all fields.'); return; }
  if (pass.length < 6) { showMsg('Password must be at least 6 characters.'); return; }
  const btn = document.getElementById('signupBtn');
  btn.disabled = true; btn.textContent = 'Creating account...';
  try {
    const cred = await auth.createUserWithEmailAndPassword(email, pass);
    await cred.user.updateProfile({ displayName: name });
    showMsg('Account created! Redirecting...', 'success');
  } catch(e) {
    showMsg(friendlyError(e.code));
    btn.disabled = false; btn.textContent = 'Create Account';
  }
}

async function googleLogin() {
  try {
    const provider = new firebase.auth.GoogleAuthProvider();
    await auth.signInWithPopup(provider);
  } catch(e) {
    showMsg(friendlyError(e.code));
  }
}

function friendlyError(code) {
  const map = {
    'auth/user-not-found': 'No account found with this email.',
    'auth/wrong-password': 'Incorrect password. Try again.',
    'auth/email-already-in-use': 'This email is already registered. Sign in instead.',
    'auth/invalid-email': 'Please enter a valid email address.',
    'auth/weak-password': 'Password must be at least 6 characters.',
    'auth/popup-closed-by-user': 'Google sign-in was cancelled.',
    'auth/network-request-failed': 'Network error. Check your connection.',
  };
  return map[code] || 'Something went wrong. Please try again.';
}

document.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    if (document.getElementById('loginForm').classList.contains('active')) emailLogin();
    else emailSignup();
  }
});
</script>
</body>
</html>
