<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ChatWith.ai</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:#0a0f1e; --bg2:#0d1426; --bg3:#111827; --bg4:#1a2340; --bg5:#1e2a4a;
      --border:rgba(99,179,237,0.1); --border2:rgba(99,179,237,0.18);
      --text:#e2e8f0; --muted:#64748b; --muted2:#94a3b8;
      --blue:#3b82f6; --blue2:#60a5fa; --cyan:#06b6d4;
      --grad:linear-gradient(135deg,#3b82f6,#06b6d4);
    }
    html,body{height:100%;overflow:hidden;font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);font-size:15px;}
    .app{display:flex;height:100vh;}

    /* SIDEBAR */
    .sidebar{width:260px;flex-shrink:0;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;transition:transform .3s ease;}
    .sb-top{padding:16px 14px 14px;border-bottom:1px solid var(--border);}
    .logo-row{display:flex;align-items:center;gap:9px;margin-bottom:14px;}
    .logo-box{width:32px;height:32px;border-radius:9px;background:var(--grad);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;box-shadow:0 4px 12px rgba(59,130,246,0.3);}
    .logo-txt{font-size:15px;font-weight:600;color:var(--text);letter-spacing:-.2px;}
    .logo-txt span{color:var(--blue2);}
    .new-btn{width:100%;padding:9px 12px;background:var(--bg4);border:1px solid var(--border2);border-radius:8px;color:var(--text);font-family:'Inter',sans-serif;font-size:13px;font-weight:500;cursor:pointer;display:flex;align-items:center;gap:8px;transition:background .15s,border-color .15s;}
    .new-btn:hover{background:var(--bg5);border-color:rgba(99,179,237,0.3);}
    .sb-list{flex:1;overflow-y:auto;padding:10px 8px;}
    .sb-list::-webkit-scrollbar{width:3px;}
    .sb-list::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px;}
    .list-title{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:4px 8px 8px;}
    .chat-row{padding:8px 10px;border-radius:7px;font-size:13px;color:var(--muted2);cursor:pointer;display:flex;align-items:center;gap:8px;transition:background .15s,color .15s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .chat-row:hover{background:var(--bg3);color:var(--text);}
    .chat-row.active{background:var(--bg4);color:var(--text);}
    .sb-bot{padding:12px 14px;border-top:1px solid var(--border);}
    .limit-box{background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:10px;}
    .limit-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
    .limit-label{font-size:12px;color:var(--muted2);}
    .limit-num{font-size:12px;font-weight:600;color:var(--blue2);}
    .bar-bg{background:var(--bg4);border-radius:4px;height:4px;overflow:hidden;}
    .bar-fill{height:100%;border-radius:4px;background:var(--grad);transition:width .4s ease;}
    .limit-sub{font-size:11px;color:var(--muted);margin-top:6px;}
    .user-row{display:flex;align-items:center;gap:9px;padding:8px;border-radius:8px;cursor:pointer;transition:background .15s;}
    .user-row:hover{background:var(--bg3);}
    .user-av{width:30px;height:30px;border-radius:50%;background:var(--grad);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;flex-shrink:0;}
    .user-name{font-size:13px;font-weight:500;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .user-plan{font-size:11px;color:var(--blue2);}
    .logout{background:none;border:none;color:var(--muted);cursor:pointer;padding:4px;font-size:15px;transition:color .15s;flex-shrink:0;}
    .logout:hover{color:var(--text);}

    /* MAIN */
    .main{flex:1;display:flex;flex-direction:column;overflow:hidden;background:var(--bg);}
    .topbar{display:flex;align-items:center;gap:10px;padding:12px 20px;border-bottom:1px solid var(--border);flex-shrink:0;background:rgba(10,15,30,0.8);backdrop-filter:blur(12px);}
    .menu-btn{background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer;padding:5px;border-radius:6px;display:none;transition:color .15s;}
    .menu-btn:hover{color:var(--text);}
    .model-pill{margin:0 auto;background:var(--bg3);border:1px solid var(--border2);border-radius:20px;padding:5px 14px;font-size:12px;color:var(--muted2);display:flex;align-items:center;gap:7px;}
    .online-dot{width:6px;height:6px;border-radius:50%;background:#22c55e;box-shadow:0 0 6px rgba(34,197,94,0.6);}

    /* MESSAGES */
    .msgs-wrap{flex:1;overflow-y:auto;scroll-behavior:smooth;}
    .msgs-wrap::-webkit-scrollbar{width:4px;}
    .msgs-wrap::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px;}
    .welcome{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:60px 24px 32px;min-height:65vh;animation:fadeUp .4s ease both;}
    .welcome-icon{width:72px;height:72px;border-radius:20px;background:var(--grad);display:flex;align-items:center;justify-content:center;font-size:34px;margin-bottom:22px;box-shadow:0 12px 40px rgba(59,130,246,0.3);}
    .welcome h1{font-size:28px;font-weight:600;letter-spacing:-.5px;margin-bottom:10px;}
    .welcome p{font-size:14px;color:var(--muted2);margin-bottom:32px;max-width:380px;line-height:1.6;}
    .sugs{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-width:540px;width:100%;}
    .sug{padding:13px 15px;text-align:left;background:var(--bg2);border:1px solid var(--border);border-radius:10px;color:var(--muted2);font-family:'Inter',sans-serif;font-size:13px;cursor:pointer;transition:all .2s;line-height:1.45;}
    .sug:hover{background:var(--bg3);color:var(--text);border-color:var(--border2);transform:translateY(-1px);}
    .sug-icon{display:block;margin-bottom:5px;font-size:17px;}
    .msgs{padding:20px;max-width:820px;margin:0 auto;width:100%;}
    .msg-row{display:flex;gap:12px;margin-bottom:20px;animation:fadeUp .25s ease both;}
    .msg-row.user{flex-direction:row-reverse;}
    .msg-av{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;margin-top:2px;font-weight:600;}
    .msg-row.user .msg-av{background:var(--grad);color:#fff;font-size:13px;}
    .msg-row.bot .msg-av{background:var(--bg3);border:1px solid var(--border2);}
    .msg-bub{max-width:72%;padding:12px 16px;border-radius:14px;font-size:14.5px;line-height:1.7;}
    .msg-row.user .msg-bub{background:var(--bg4);border:1px solid var(--border2);border-bottom-right-radius:4px;}
    .msg-row.bot .msg-bub{background:var(--bg2);border:1px solid var(--border);border-bottom-left-radius:4px;}
    .msg-bub p{margin-bottom:8px;} .msg-bub p:last-child{margin-bottom:0;}
    .msg-bub strong{color:var(--blue2);}
    .msg-bub code{font-size:13px;background:rgba(0,0,0,0.4);padding:2px 6px;border-radius:4px;color:#7dd3fc;}
    .msg-bub pre{background:rgba(0,0,0,0.4);border:1px solid var(--border2);border-radius:8px;padding:14px;overflow-x:auto;margin:10px 0;}
    .msg-bub pre code{background:none;padding:0;color:#c9d1d9;}
    .msg-bub ul,.msg-bub ol{padding-left:20px;margin:6px 0;}
    .msg-bub li{margin-bottom:4px;}
    .msg-img{max-width:240px;border-radius:10px;margin-top:6px;border:1px solid var(--border2);}
    .msg-file{background:var(--bg3);border:1px solid var(--border2);border-radius:8px;padding:8px 12px;font-size:12px;color:var(--muted2);margin-top:6px;display:flex;align-items:center;gap:6px;}

    /* TYPING */
    .typing{display:flex;gap:5px;padding:3px 2px;align-items:center;}
    .t-dot{width:7px;height:7px;border-radius:50%;background:var(--blue2);animation:tdot 1.2s infinite ease-in-out;}
    .t-dot:nth-child(2){animation-delay:.2s;background:var(--cyan);}
    .t-dot:nth-child(3){animation-delay:.4s;background:var(--blue2);}
    @keyframes tdot{0%,60%,100%{transform:translateY(0);opacity:.3}30%{transform:translateY(-6px);opacity:1}}

    /* INPUT */
    .input-zone{padding:12px 20px 16px;flex-shrink:0;border-top:1px solid var(--border);background:rgba(10,15,30,0.9);backdrop-filter:blur(12px);}

    /* Attachment preview */
    .attach-preview{max-width:820px;margin:0 auto 8px;display:flex;gap:8px;flex-wrap:wrap;}
    .attach-item{background:var(--bg3);border:1px solid var(--border2);border-radius:8px;padding:6px 10px;font-size:12px;color:var(--muted2);display:flex;align-items:center;gap:6px;position:relative;}
    .attach-remove{background:none;border:none;color:var(--muted);cursor:pointer;font-size:14px;padding:0;line-height:1;}
    .attach-remove:hover{color:#ef4444;}
    .attach-img-preview{width:48px;height:48px;border-radius:6px;object-fit:cover;border:1px solid var(--border2);}

    .input-box{display:flex;align-items:flex-end;gap:8px;background:var(--bg2);border:1px solid var(--border2);border-radius:13px;padding:8px 10px;max-width:820px;margin:0 auto;transition:border-color .2s,box-shadow .2s;}
    .input-box:focus-within{border-color:var(--blue);box-shadow:0 0 0 3px rgba(59,130,246,0.1);}

    /* + Button */
    .plus-btn{width:34px;height:34px;border-radius:8px;background:var(--bg3);border:1px solid var(--border2);color:var(--muted2);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s;position:relative;}
    .plus-btn:hover{background:var(--bg4);border-color:var(--blue);color:var(--blue2);}

    /* Attachment popup */
    .attach-popup{position:absolute;bottom:46px;left:0;background:var(--bg2);border:1px solid var(--border2);border-radius:12px;padding:8px;width:200px;box-shadow:0 16px 40px rgba(0,0,0,0.5);display:none;z-index:50;animation:popUp .15s ease;}
    .attach-popup.open{display:block;}
    @keyframes popUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    .attach-option{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;font-size:13px;color:var(--text2);cursor:pointer;transition:background .15s;border:none;background:none;width:100%;font-family:'Inter',sans-serif;text-align:left;}
    .attach-option:hover{background:var(--bg3);color:var(--text);}
    .attach-option-icon{font-size:17px;flex-shrink:0;}
    .attach-divider{height:1px;background:var(--border);margin:4px 0;}

    textarea{flex:1;background:none;border:none;outline:none;color:var(--text);font-family:'Inter',sans-serif;font-size:14.5px;line-height:1.5;resize:none;max-height:180px;}
    textarea::placeholder{color:var(--muted);}
    .send-btn{width:36px;height:36px;border-radius:9px;background:var(--grad);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#fff;transition:opacity .15s,transform .1s;}
    .send-btn:hover{opacity:.85;}
    .send-btn:active{transform:scale(.95);}
    .send-btn:disabled{background:var(--bg3);cursor:not-allowed;}
    .input-footer{display:flex;justify-content:space-between;max-width:820px;margin:7px auto 0;font-size:11px;color:var(--muted);}
    .counter{background:var(--bg3);border:1px solid var(--border);border-radius:20px;padding:2px 10px;font-size:11px;font-weight:500;color:var(--blue2);}
    @keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

    @media(max-width:680px){
      .sidebar{position:fixed;z-index:100;height:100%;transform:translateX(-100%);}
      .sidebar.open{transform:translateX(0);box-shadow:4px 0 24px rgba(0,0,0,0.5);}
      .menu-btn{display:flex;}
      .sugs{grid-template-columns:1fr;}
      .msg-bub{max-width:88%;}
    }
  </style>
</head>
<body>
<div class="app">
  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <div class="sb-top">
      <div class="logo-row">
        <div class="logo-box">🤖</div>
        <span class="logo-txt">ChatWith<span>.ai</span></span>
      </div>
      <button class="new-btn" onclick="newChat()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        New chat
      </button>
    </div>
    <div class="sb-list" id="chatList"><div class="list-title">Recent</div></div>
    <div class="sb-bot">
      <div class="limit-box">
        <div class="limit-row">
          <span class="limit-label">Messages today</span>
          <span class="limit-num" id="limitNum">50 / 50</span>
        </div>
        <div class="bar-bg"><div class="bar-fill" id="barFill" style="width:100%"></div></div>
        <div class="limit-sub">Resets at midnight</div>
      </div>
      <div class="user-row">
        <div class="user-av" id="uAv">?</div>
        <div style="flex:1;min-width:0">
          <div class="user-name" id="uName">Loading...</div>
          <div class="user-plan">✦ Free plan</div>
        </div>
        <button class="logout" onclick="logout()" title="Sign out">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </button>
      </div>
    </div>
  </aside>

  <!-- MAIN -->
  <main class="main">
    <div class="topbar">
      <button class="menu-btn" onclick="toggleSb()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <div class="model-pill">
        <div class="online-dot"></div>
        ChatWith.ai · Llama 3.3 70B
      </div>
    </div>

    <div class="msgs-wrap" id="msgsWrap">
      <div class="welcome" id="welcome">
        <div class="welcome-icon">🤖</div>
        <h1>How can I help you today?</h1>
        <p>Ask me anything, upload images or files — I give fast, accurate answers powered by Gemini AI.</p>
        <div class="sugs">
          <button class="sug" onclick="useSug(this)"><span class="sug-icon">✍️</span>Write a professional email</button>
          <button class="sug" onclick="useSug(this)"><span class="sug-icon">💡</span>Explain something simply</button>
          <button class="sug" onclick="useSug(this)"><span class="sug-icon">🔍</span>Help me debug my code</button>
          <button class="sug" onclick="useSug(this)"><span class="sug-icon">🎯</span>Ideas for my project</button>
        </div>
      </div>
      <div class="msgs" id="msgs"></div>
    </div>

    <div class="input-zone">
      <!-- Attachment previews -->
      <div class="attach-preview" id="attachPreview"></div>

      <div class="input-box">
        <!-- + Button with popup -->
        <div style="position:relative;flex-shrink:0">
          <button class="plus-btn" id="plusBtn" onclick="togglePopup(event)" title="Add attachment">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          </button>
          <div class="attach-popup" id="attachPopup">
            <button class="attach-option" onclick="triggerFileInput('image')">
              <span class="attach-option-icon">🖼️</span>
              <span>Upload Image</span>
            </button>
            <button class="attach-option" onclick="triggerFileInput('file')">
              <span class="attach-option-icon">📄</span>
              <span>Upload File / PDF</span>
            </button>
            <div class="attach-divider"></div>
            <button class="attach-option" onclick="triggerFileInput('screenshot')">
              <span class="attach-option-icon">📸</span>
              <span>Screenshot</span>
            </button>
            <button class="attach-option" onclick="startDeepResearch()">
              <span class="attach-option-icon">🔬</span>
              <span>Deep Research</span>
            </button>
          </div>
        </div>

        <!-- Hidden file inputs -->
        <input type="file" id="imageInput" accept="image/*" style="display:none" onchange="handleFile(event,'image')"/>
        <input type="file" id="fileInput" accept=".pdf,.txt,.doc,.docx,.csv,.json,.py,.js,.html,.css" style="display:none" onchange="handleFile(event,'file')"/>
        <input type="file" id="screenshotInput" accept="image/*" capture="screen" style="display:none" onchange="handleFile(event,'image')"/>

        <textarea id="inp" placeholder="Message ChatWith.ai..." rows="1"
          onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>

        <button class="send-btn" id="sendBtn" onclick="send()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
      </div>

      <div class="input-footer">
        <span>AI can make mistakes. Verify important info.</span>
        <span class="counter" id="counter">50 left today</span>
      </div>
    </div>
  </main>
</div>

<script>
// ── Firebase Config ─────────────────────────────
const firebaseConfig = {
  apiKey: "AIzaSyAuhxzDIh1R1QU41aAM4yo7kHnyM1FVcHE",
  authDomain: "chatwith-ai-cbdcc.firebaseapp.com",
  projectId: "chatwith-ai-cbdcc",
  storageBucket: "chatwith-ai-cbdcc.firebasestorage.app",
  messagingSenderId: "405030023529",
  appId: "1:405030023529:web:b5d61cde0a6dfb31b68df8"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db   = firebase.firestore();

// ── IMPORTANT: Replace with your Groq API key ───
// Get FREE key at: console.groq.com (no credit card needed!)
const GROQ_API_KEY = "";
const GROQ_URL = "https://chatwith-ai-backend.onrender.com/api/chat";
const GROQ_MODEL = "llama-3.3-70b-versatile";

const DAILY_LIMIT = 50;
const SYSTEM = `You are ChatWith.ai, a helpful and friendly AI assistant. Give clear, accurate, concise answers. Use simple language. Use bullet points only when helpful. If you don't know something, say so honestly. When analyzing images or files, describe what you see thoroughly and answer any questions about them.`;

let user=null, history=[], sessions=[], currentSession=null, loading=false;
let attachments=[]; // stores {type, data, mimeType, name}

// ── AUTH ─────────────────────────────────────────
auth.onAuthStateChanged(async u=>{
  if(!u){window.location.href="index.html";return;}
  user=u;
  document.getElementById("uAv").textContent=(u.displayName||u.email||"U").charAt(0).toUpperCase();
  document.getElementById("uName").textContent=u.displayName||u.email;
  await loadSessions();
  updateLimit();
  newChat();
});

async function logout(){await auth.signOut();window.location.href="index.html";}

// ── LIMIT ─────────────────────────────────────────
function todayKey(){return `cwai_${user.uid}_${new Date().toISOString().slice(0,10)}`;}
function getUsed(){return parseInt(localStorage.getItem(todayKey())||"0",10);}
function getLeft(){return Math.max(0,DAILY_LIMIT-getUsed());}
function incUsed(){localStorage.setItem(todayKey(),getUsed()+1);updateLimit();}

function updateLimit(){
  const left=getLeft(),pct=(left/DAILY_LIMIT)*100;
  document.getElementById("limitNum").textContent=left+" / "+DAILY_LIMIT;
  document.getElementById("barFill").style.width=pct+"%";
  document.getElementById("counter").textContent=left+" left today";
  document.getElementById("barFill").style.background=pct>30?"var(--grad)":pct>10?"linear-gradient(135deg,#f59e0b,#d97706)":"linear-gradient(135deg,#ef4444,#dc2626)";
  document.getElementById("limitNum").style.color=pct>30?"var(--blue2)":pct>10?"#fbbf24":"#f87171";
  if(left===0){
    document.getElementById("inp").placeholder="Daily limit reached — come back tomorrow!";
    document.getElementById("inp").disabled=true;
    document.getElementById("sendBtn").disabled=true;
  }
}

// ── SESSIONS ─────────────────────────────────────
async function loadSessions(){
  try{
    const snap=await db.collection("users").doc(user.uid).collection("sessions").orderBy("updatedAt","desc").limit(20).get();
    sessions=snap.docs.map(d=>({id:d.id,...d.data()}));
    renderSessions();
  }catch(e){}
}

function renderSessions(){
  const list=document.getElementById("chatList");
  list.innerHTML='<div class="list-title">Recent</div>';
  sessions.forEach(s=>{
    const el=document.createElement("div");
    el.className="chat-row"+(s.id===currentSession?" active":"");
    el.innerHTML=`<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><span style="overflow:hidden;text-overflow:ellipsis">${s.title||"New chat"}</span>`;
    el.onclick=()=>loadSession(s);
    list.appendChild(el);
  });
}

async function saveSession(title){
  if(!currentSession||!user)return;
  try{
    await db.collection("users").doc(user.uid).collection("sessions").doc(currentSession).set({title:title.slice(0,50),updatedAt:new Date().toISOString()});
    if(!sessions.find(s=>s.id===currentSession))sessions.unshift({id:currentSession,title});
    renderSessions();
  }catch(e){}
}

function loadSession(s){
  currentSession=s.id;history=s.messages||[];
  document.getElementById("msgs").innerHTML="";
  document.getElementById("welcome").style.display="none";
  history.forEach(m=>renderBubble(m.role==="user"?"user":"bot",m.text||"",m.imgSrc||null));
  renderSessions();
  if(window.innerWidth<680)document.getElementById("sidebar").classList.remove("open");
}

function newChat(){
  currentSession="s_"+Date.now();history=[];attachments=[];
  document.getElementById("msgs").innerHTML="";
  document.getElementById("welcome").style.display="flex";
  document.getElementById("attachPreview").innerHTML="";
  renderSessions();
  if(window.innerWidth<680)document.getElementById("sidebar").classList.remove("open");
}

// ── ATTACHMENT HANDLING ───────────────────────────
function togglePopup(e){
  e.stopPropagation();
  document.getElementById("attachPopup").classList.toggle("open");
}

document.addEventListener("click",()=>{
  document.getElementById("attachPopup").classList.remove("open");
});

function triggerFileInput(type){
  document.getElementById("attachPopup").classList.remove("open");
  if(type==="image")document.getElementById("imageInput").click();
  else if(type==="file")document.getElementById("fileInput").click();
  else if(type==="screenshot")document.getElementById("screenshotInput").click();
}

function handleFile(event,type){
  const file=event.target.files[0];
  if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{
    const base64=e.target.result.split(",")[1];
    const mimeType=file.type;
    const attachment={type,data:base64,mimeType,name:file.name,previewUrl:e.target.result};
    attachments.push(attachment);
    renderAttachPreview();
  };
  reader.readAsDataURL(file);
  event.target.value="";
}

function renderAttachPreview(){
  const container=document.getElementById("attachPreview");
  container.innerHTML="";
  attachments.forEach((att,i)=>{
    const item=document.createElement("div");
    item.className="attach-item";
    if(att.type==="image"){
      item.innerHTML=`<img src="${att.previewUrl}" class="attach-img-preview"/><span style="font-size:12px;color:var(--muted2);max-width:100px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${att.name}</span><button class="attach-remove" onclick="removeAttach(${i})">✕</button>`;
    }else{
      item.innerHTML=`<span>📄</span><span style="font-size:12px;color:var(--muted2);max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${att.name}</span><button class="attach-remove" onclick="removeAttach(${i})">✕</button>`;
    }
    container.appendChild(item);
  });
}

function removeAttach(i){
  attachments.splice(i,1);
  renderAttachPreview();
}

function startDeepResearch(){
  document.getElementById("attachPopup").classList.remove("open");
  const inp=document.getElementById("inp");
  inp.value="Do a deep research on: ";
  inp.focus();
  inp.setSelectionRange(inp.value.length,inp.value.length);
}

// ── SEND ─────────────────────────────────────────
async function send(){
  const el=document.getElementById("inp");
  const txt=el.value.trim();
  if((!txt&&attachments.length===0)||loading)return;
  if(getLeft()<=0){renderBubble("bot","⚠️ You've used all **50 messages** for today. Your limit resets at midnight!");return;}

  document.getElementById("welcome").style.display="none";

  // Show user message with any image preview
  const imgSrc=attachments.length>0&&attachments[0].type==="image"?attachments[0].previewUrl:null;
  const fileNames=attachments.map(a=>a.name).join(", ");
  const displayText=txt+(fileNames?`\n\n📎 ${fileNames}`:"");
  renderBubble("user",displayText,imgSrc);

  el.value=""; autoResize(el);
  document.getElementById("attachPreview").innerHTML="";

  const tid=showTyping();
  setLoad(true); incUsed();

  // Build message for Groq
  let fullText = txt;
  attachments.forEach(att=>{
    if(att.type==="image"){
      fullText += `\n[Image attached: ${att.name}]`;
    } else {
      fullText += `\n[File attached: ${att.name}]`;
    }
  });

  attachments=[];

  // Add to history
  history.push({role:"user",text:fullText,imgSrc});
  if(history.length===1)saveSession(txt||"File upload");

  try{
    const reply=await callGroq(history);
    removeTyping(tid);
    renderBubble("bot",reply);
    history.push({role:"model",parts:[{text:reply}],text:reply});
    saveSession(history[0].text||"Chat");
  }catch(e){
    removeTyping(tid);
    renderBubble("bot","⚠️ Error: "+e.message+"\n\nMake sure you pasted your Groq API key in chat.html");
  }
  setLoad(false);scroll();
}

// ── GROQ API ─────────────────────────────────────
async function callGroq(msgs){
  const messages=[{role:"system",content:SYSTEM}];
  msgs.forEach(m=>{
    let content=m.text||"";
    if(m.imgSrc) content="[User sent an image] "+content;
    messages.push({role:m.role==="user"?"user":"assistant",content:content});
  });

  const r=await fetch("https://chatwith-ai-backend.onrender.com/api/chat",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({messages})
  });

  if(!r.ok){
    const e=await r.json().catch(()=>{});
    throw new Error(e?.error||"Backend error "+r.status);
  }

  const d=await r.json();
  return d.reply||"Sorry, could not get a response.";
}

// ── RENDER ────────────────────────────────────────
function renderBubble(role,text,imgSrc=null){
  const msgs=document.getElementById("msgs");
  const row=document.createElement("div");
  row.className="msg-row "+role;
  const av=document.createElement("div");
  av.className="msg-av";
  av.textContent=role==="user"?(user?.displayName||user?.email||"U").charAt(0).toUpperCase():"🤖";
  const bub=document.createElement("div");
  bub.className="msg-bub";
  if(imgSrc){
    const img=document.createElement("img");
    img.src=imgSrc; img.className="msg-img";
    bub.appendChild(img);
  }
  if(text){
    const textDiv=document.createElement("div");
    textDiv.innerHTML=fmt(text);
    bub.appendChild(textDiv);
  }
  row.appendChild(av);row.appendChild(bub);
  msgs.appendChild(row);scroll();
}

function fmt(t){
  return t
    .replace(/```(\w*)\n([\s\S]*?)```/g,'<pre><code>$2</code></pre>')
    .replace(/`([^`]+)`/g,'<code>$1</code>')
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/^[\-\*] (.+)$/gm,'<li>$1</li>')
    .replace(/^\d+\. (.+)$/gm,'<li>$1</li>')
    .split('\n\n').map(p=>p.trim()?`<p>${p.replace(/\n/g,'<br>')}</p>`:'').join('');
}

function showTyping(){
  const id="t"+Date.now(),msgs=document.getElementById("msgs");
  const row=document.createElement("div");row.className="msg-row bot";row.id=id;
  row.innerHTML=`<div class="msg-av">🤖</div><div class="msg-bub"><div class="typing"><div class="t-dot"></div><div class="t-dot"></div><div class="t-dot"></div></div></div>`;
  msgs.appendChild(row);scroll();return id;
}
function removeTyping(id){const el=document.getElementById(id);if(el)el.remove();}
function setLoad(s){loading=s;document.getElementById("sendBtn").disabled=s;}
function scroll(){const w=document.getElementById("msgsWrap");w.scrollTop=w.scrollHeight;}
function autoResize(el){el.style.height="auto";el.style.height=Math.min(el.scrollHeight,180)+"px";}
function handleKey(e){if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send();}}
function useSug(btn){document.getElementById("inp").value=btn.querySelector("span:last-child")?.textContent||btn.textContent.replace(/^\S+\s*/,"");document.getElementById("inp").focus();}
function toggleSb(){document.getElementById("sidebar").classList.toggle("open");}
</script>
